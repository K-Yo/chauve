# .github/workflows/release.yml
name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: chauve
            asset_name: chauve-linux-amd64
          - os: windows-latest
            artifact_name: chauve.exe
            asset_name: chauve-windows-amd64.exe
          - os: macos-latest
            artifact_name: chauve
            asset_name: chauve-macos-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # ── Linux system dependencies ───────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      # ── Dioxus CLI ──────────────────────────────────────────────────
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      # ── Node + Tailwind CSS ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Install Tailwind CSS
        run: npm install -g tailwindcss

      - name: Build Tailwind CSS
        run: |
          tailwindcss \
            -i ./assets/source.css \
            -o ./assets/main.css \
            --minify

      # ── Build ───────────────────────────────────────────────────────
      - name: Build desktop app
        run: dx build --release --platform desktop

      # ── Locate & upload artifact ────────────────────────────────────
      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/dx/chauve/release/linux/app/${{ matrix.artifact_name }}
      - name: Upload artifact (Linux)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/dx/chauve/release/macos/app/${{ matrix.artifact_name }}

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target\dx\chauve\release\windows\app\${{ matrix.artifact_name }}

  # ── GitHub Release ────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}