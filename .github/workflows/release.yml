# .github/workflows/release.yml
name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_name: chauve-linux-amd64
            asset_path: target/dx/chauve/release/linux/app/chauve
          - os: windows-latest
            asset_name: chauve-windows-amd64
            asset_path: target/dx/chauve/release/windows/app/chauve.exe
          - os: macos-latest
            asset_name: chauve-macos-arm64
            asset_path: target/dx/chauve/release/macos/Chauve.app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Rust toolchain ──────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # ── Linux system dependencies ───────────────────────────────────

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential curl wget file \
            libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld

      # Fail here, naming the missing library, rather than 9 minutes later
      # inside a -sys crate build script.
      - name: Verify Linux system dependencies
        if: runner.os == 'Linux'
        run: pkg-config --modversion glib-2.0 gtk+-3.0 javascriptcoregtk-4.1 libsoup-3.0

      # ── Dioxus CLI ──────────────────────────────────────────────────
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      # ── Node + Tailwind CSS ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i ./assets/source.css -o ./assets/main.css -m

      # ── Code quality checks ─────────────────────────────────────────
      - name: Run cargo check
        run: cargo check --verbose --features desktop

      - name: Run cargo test
        run: cargo test --verbose --features desktop

      # ── Build ───────────────────────────────────────────────────────
      - name: Build desktop app
        shell: bash
        run: dx build --release --platform desktop

      # ── Locate & upload artifact ────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_path }}

  # ── GitHub Release ────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        shell: bash
        run: |
          TAG=${{ github.ref_name }}
          mkdir -p release-assets

          # Linux: rename binary to include version
          cp artifacts/chauve-linux-amd64/chauve release-assets/chauve-linux-amd64-${TAG}

          # Windows: rename .exe to include version
          cp artifacts/chauve-windows-amd64/chauve.exe release-assets/chauve-windows-amd64-${TAG}.exe

          # macOS: compress .app bundle into a versioned zip
          cd artifacts/chauve-macos-arm64
          zip -r ../../release-assets/chauve-macos-arm64-${TAG}.zip *
          cd ../../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
