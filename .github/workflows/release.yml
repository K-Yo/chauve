# .github/workflows/release.yml
name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: chauve-linux-amd64
          - os: windows-latest
            asset_name: chauve-windows-amd64.exe
          - os: macos-latest
            asset_name: chauve-macos-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # ── Linux system dependencies ───────────────────────────────────
      
      - name: Cache apt packages
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: |
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      # ── Dioxus CLI ──────────────────────────────────────────────────
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      # ── Node + Tailwind CSS ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      - name: Build Tailwind CSS (Linux and MacOS)
        if: matrix.os != 'windows-latest'
        run: |
          npx @tailwindcss/cli \
            -i ./assets/source.css \
            -o ./assets/main.css \
            -m

      - name: Build Tailwind CSS (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npx @tailwindcss/cli -i .\assets\source.css -o .\assets\main.css -m

      # ── Code quality checks ─────────────────────────────────────────
      - name: Run cargo check
        run: cargo check --verbose --features desktop

      - name: Run cargo test
        run: cargo test --verbose --features desktop

      # ── Build ───────────────────────────────────────────────────────
      - name: Build desktop app (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: dx bundle --release --platform desktop --package-types rpm --package-types deb --package-types appimage

      - name: Build desktop app (MacOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: dx bundle --release --platform desktop --package-types macos --package-types dmg

      - name: Build desktop app (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: dx bundle --release --platform desktop --package-types msi --package-types nsis

      # ── Locate & upload artifact ────────────────────────────────────
      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/dx/chauve/bundle/linux/
      - name: Upload artifact (MacOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/dx/chauve/bundle/macos/

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target\dx\chauve\bundle\windows\

  # ── GitHub Release ────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
