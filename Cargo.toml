[package]
name = "chauve"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
dioxus = { version = "0.7.7", features = [] }
reqwest = { version = "0.13", features = ["json"] }
tokio = {version="1.52.2", features = ["macros","time"]}
async-trait = "0.1.89"
futures = "0.3"
anyhow = "1.0.102"
thiserror = "2.0.18"
tracing = "0.1.44"
dioxus-logger = "0.7.9"
toml = "1.1.2"
directories = "6"
url = "2.5.8"
notify-rust = "4"
image = "0.25.10"
lazy_static = "1.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Provides subtitle, per-severity sounds, and direct macOS Notification Center access.
mac-notification-sys = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Proper WinRT toast notifications: sound selection, duration, attribution text, app ID.
winrt-toast-reborn = "0.3"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
