[package]
name = "chauve"
version = "0.1.0"
edition = "2024"

[dependencies]
config = "0.15.19"
serde = {version="1.0.228", features = ["derive"]}
chrono = { version = "0.4.42", features = ["serde"] }
dioxus = { version = "0.7.1", features = [] }
reqwest = { version = "0.12.24", features = ["json"] }
tokio = "1.48.0"
async-trait = "0.1.89"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
